<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#03080f">
<link rel="apple-touch-icon" href="/web/marca/jarvis-192.png">
<link rel="icon" href="/web/marca/jarvis-192.png">
<title>Jarvis</title>
<!-- Tela leve do celular (pelo Tailscale). O iPhone não deixa o microfone ouvindo o tempo todo nem som tocar sem
     toque: aqui é TOCAR pra falar. A gravação vai pro PC (/api/celular/ouvir → Whisper), a resposta vem do mesmo
     /api/conversar da tela do PC, e a voz toca num áudio só, destravado no primeiro toque. -->
<style>
  :root { --fundo: #03080f; --ciano: #39d0ff; --ciano-fraco: #39d0ff33; --texto: #d8f3ff; --fraco: #6f93a8;
          --cartao: rgba(57, 208, 255, .07); --borda: rgba(57, 208, 255, .25); --vermelho: #ff5c6c; --nivel: 0;
          --nucleo: min(56vw, 30vh, 300px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto);
               font: 16px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
         padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
         background: radial-gradient(ellipse at 50% 40%, #0a2133 0%, var(--fundo) 65%); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 0 6px; z-index: 3; }
  header img { width: 28px; height: 28px; border-radius: 8px; }
  header b { font-size: 16px; letter-spacing: .3em; color: var(--ciano); }
  #relogio { margin-left: auto; font-size: 13px; color: var(--fraco); font-variant-numeric: tabular-nums; }

  /* o meio: núcleo no centro; o palco (hologramas, globo, painéis) cobre o meio quando tem algo */
  #meio { position: relative; flex: 1; min-height: 0; }
  .palco { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); display: flex; flex-direction: column;
           align-items: center; z-index: 1; transition: left .5s, top .5s, transform .5s; }
  #onda { position: absolute; left: 50%; top: calc(var(--nucleo) / 2); width: calc(var(--nucleo) * 1.8); height: calc(var(--nucleo) * 1.8);
          transform: translate(-50%, -50%); pointer-events: none; }
  .nucleo { position: relative; width: var(--nucleo); height: var(--nucleo); cursor: pointer; }
  .anel, .centro { position: absolute; border-radius: 50%; inset: 0; }
  .a1 { border: 2px solid var(--ciano-fraco); border-top-color: var(--ciano); animation: gira 6s linear infinite; }
  .a2 { inset: 10%; border: 5px dotted var(--ciano-fraco); animation: gira 14s linear infinite reverse; }
  .a3 { inset: 21%; border: 2px solid var(--ciano); border-left-color: transparent; border-right-color: transparent; animation: gira 3s linear infinite; }
  .centro { inset: 27%; background: radial-gradient(circle, #39d0ff66 0%, #39d0ff22 45%, transparent 72%);
            box-shadow: 0 0 calc(30px + var(--nivel) * 70px) var(--ciano); }
  .sete { position: absolute; left: 50%; top: 50%; width: 36%; height: 36%; pointer-events: none;
          transform: translate(-50%, -50%) scale(calc(1 + var(--nivel) * .28));
          filter: drop-shadow(0 0 6px var(--ciano)) drop-shadow(0 0 calc(12px + var(--nivel) * 28px) var(--ciano)); }
  body.gravando { --ciano: #ff5c6c; --ciano-fraco: #ff5c6c33; }
  body.gravando .centro, body.pensando .centro { animation: pulsa 1.2s ease-in-out infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  @keyframes pulsa { 50% { transform: scale(1.12); } }
  #estado { margin: 14px 0 0; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--ciano); text-align: center; }

  #palco { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2; background: transparent;
           opacity: 0; pointer-events: none; transition: opacity .5s; border-radius: 16px; }
  html.palco-ativo #palco { opacity: 1; pointer-events: auto; }
  /* com algo no palco, o núcleo encolhe pro canto de cima (igual no PC) */
  html.palco-ativo .palco { left: calc(100% - var(--nucleo) * .17 - 4px); top: calc(var(--nucleo) * .17 + 4px);
                            transform: translate(-50%, -50%) scale(.34); z-index: 3; }
  html.palco-ativo #estado { display: none; }
  html.palco-ativo #conversa { max-height: 20%; }
  /* X pra fechar o que está aberto (canto de cima à esquerda; à direita fica o núcleo pequeno) */
  #fechar-palco { position: absolute; top: 6px; left: 6px; z-index: 4; width: 40px; height: 40px; border-radius: 50%;
                  border: 1px solid var(--ciano); background: rgba(3, 8, 15, .8); color: var(--ciano); font-size: 18px;
                  display: none; place-items: center; }
  html.palco-ativo #fechar-palco { display: grid; }

  /* conversa: as últimas falas por cima da parte de baixo do meio */
  #conversa { position: absolute; left: 0; right: 0; bottom: 0; max-height: 30%; overflow-y: auto; z-index: 3;
              display: flex; flex-direction: column; gap: 8px; padding: 18px 0 6px; -webkit-overflow-scrolling: touch;
              -webkit-mask-image: linear-gradient(transparent, #000 18px); mask-image: linear-gradient(transparent, #000 18px); }
  .fala { max-width: 86%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; font-size: 15px; }
  .eu { align-self: flex-end; background: rgba(57, 208, 255, .18); border-bottom-right-radius: 4px; }
  .ele { align-self: flex-start; background: rgba(6, 18, 29, .85); border: 1px solid var(--borda); border-bottom-left-radius: 4px; }
  .erro { align-self: center; color: var(--vermelho); font-size: 14px; text-align: center; }
  .cartao { align-self: stretch; background: rgba(6, 18, 29, .9); border: 1px solid var(--borda); border-left: 3px solid var(--ciano);
            border-radius: 12px; padding: 10px 13px; }
  .cartao h3 { margin: 0 0 4px; font-size: 12px; color: var(--ciano); text-transform: uppercase; letter-spacing: .12em; }
  .cartao .destaque { font-size: 22px; font-weight: 300; color: var(--ciano); margin: 2px 0 6px; }
  .cartao div.l { font-size: 14px; padding: 3px 0; border-top: 1px solid rgba(57, 208, 255, .1); }
  .cartao img { width: 100%; border-radius: 10px; margin-top: 6px; }
  .cartao a.link { display: block; margin-top: 8px; padding: 12px; border-radius: 10px; text-align: center; text-decoration: none;
                   background: rgba(57, 208, 255, .2); border: 1px solid var(--ciano); color: var(--texto); font-weight: 600; }

  #confirmar { display: flex; gap: 10px; padding: 8px 0 2px; }
  #confirmar[hidden] { display: none; }
  #confirmar button { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--borda); font-size: 16px;
                      background: var(--cartao); color: var(--texto); }
  #confirmar .sim { background: rgba(57, 208, 255, .25); }
  footer { display: flex; align-items: center; gap: 10px; padding: 10px 0 12px; z-index: 3; }
  #texto { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 22px; border: 1px solid var(--borda);
           background: rgba(255, 255, 255, .04); color: var(--texto); font-size: 16px; outline: none; }
  #mic { flex: none; width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--ciano); color: var(--ciano);
         background: rgba(57, 208, 255, .1); display: grid; place-items: center; }
  #mic svg { width: 24px; height: 24px; }
  /* aviso "ativar o microfone": só aparece se ele ainda NÃO está liberado (igual o de notificações do Porthon) */
  #permissao { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px;
               background: rgba(1, 6, 12, .78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #permissao[hidden] { display: none; }
  #permissao .caixa { width: min(380px, 100%); padding: 22px 20px; border-radius: 18px; text-align: center;
                      background: linear-gradient(160deg, #0c2236, #06121d); border: 1px solid var(--borda);
                      box-shadow: 0 0 40px rgba(57, 208, 255, .2); }
  #permissao .icone-mic { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center;
                          border: 2px solid var(--ciano); color: var(--ciano); box-shadow: 0 0 24px rgba(57, 208, 255, .45); }
  #permissao .icone-mic svg { width: 30px; height: 30px; }
  #permissao h2 { margin: 0 0 6px; font-size: 19px; }
  #permissao p { margin: 0 0 16px; color: var(--fraco); font-size: 14px; }
  #permissao button { width: 100%; padding: 14px; border-radius: 12px; border: 0; font-size: 16px; font-weight: 600;
                      background: var(--ciano); color: #03080f; }
  #permissao .depois { margin-top: 8px; background: transparent; color: var(--fraco); font-weight: 400; }
  #perm-ajuda { text-align: left; color: var(--texto) !important; background: rgba(255, 92, 108, .1); border: 1px solid rgba(255, 92, 108, .35);
                border-radius: 10px; padding: 10px 12px; white-space: pre-line; }
  /* deitado (paisagem): núcleo à esquerda, conversa à direita */
  @media (orientation: landscape) and (max-height: 520px) {
    :root { --nucleo: min(40vh, 220px); }
    .palco { left: 28%; top: 50%; }
    #conversa { left: 55%; top: 0; max-height: none; }
    html.palco-ativo #conversa { left: 65%; max-height: none; }
  }
  @media (min-width: 700px) and (orientation: portrait) { body { max-width: 700px; margin: 0 auto; } }
</style>
</head>
<body>
<header><img src="/web/marca/jarvis-192.png" alt=""><b>JARVIS</b><span id="relogio"></span></header>
<div id="meio">
  <iframe id="palco" src="/extensao?embutido=1&celular=1" title="Hologramas e painéis" allow="autoplay; fullscreen; accelerometer; gyroscope"></iframe>
  <button id="fechar-palco" aria-label="Fechar">✕</button>
  <div class="palco">
    <canvas id="onda" aria-hidden="true"></canvas>
    <section class="nucleo" id="nucleo" title="Toque no núcleo pra falar">
      <div class="anel a1"></div><div class="anel a2"></div><div class="anel a3"></div><div class="centro"></div>
      <img class="sete" src="/web/marca/sete.png" alt="">
    </section>
    <p id="estado">Toque no núcleo pra falar</p>
  </div>
  <main id="conversa"></main>
</div>
<div id="confirmar" hidden><button class="sim" data-sim="1">Sim, pode</button><button data-sim="">Não</button></div>
<div id="permissao" hidden role="dialog" aria-modal="true" aria-labelledby="perm-titulo">
  <div class="caixa">
    <div class="icone-mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
    <h2 id="perm-titulo">Ativar o microfone</h2>
    <p>Pra falar com o Jarvis pelo celular. Toque no botão e, quando o iPhone perguntar, escolha <b>Permitir</b>.</p>
    <p id="perm-ajuda" hidden></p>
    <button id="ativar-mic">Ativar microfone</button>
    <button id="perm-depois" class="depois">Agora não (vou só escrever)</button>
  </div>
</div>
<footer>
  <input id="texto" placeholder="Ou escreva aqui…" enterkeyhint="send" autocomplete="off">
  <button id="mic" aria-label="Falar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
</footer>
<script>
const $ = (id) => document.getElementById(id);
let sessao = null, ocupado = false;

function estado(classe, texto) {
  document.body.className = classe || "";
  $("estado").textContent = texto;
}
setInterval(() => { $("relogio").textContent = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }, 1000);
$("fechar-palco").onclick = () => {
  $("palco").contentWindow.postMessage({ limpar: true }, location.origin);
  document.documentElement.classList.remove("palco-ativo");
};
// o palco embutido avisa quando tem algo (holograma, globo, painel): o núcleo vai pro canto
addEventListener("message", (e) => {
  if (e.origin === location.origin && typeof e.data?.palco === "boolean") document.documentElement.classList.toggle("palco-ativo", e.data.palco);
});
function escrever(texto, quem) {
  if (quem === "eu") $("conversa").replaceChildren();  // só a última pergunta e a resposta dela ficam na tela
  const d = document.createElement("div");
  d.className = "fala " + quem;
  d.textContent = texto;
  $("conversa").append(d);
  d.scrollIntoView({ block: "end", behavior: "smooth" });
  return d;
}
function cartao(c) {
  const d = document.createElement("div");
  d.className = "cartao";
  if (c.titulo) d.append(Object.assign(document.createElement("h3"), { textContent: c.titulo }));
  if (c.destaque) d.append(Object.assign(document.createElement("div"), { className: "destaque", textContent: c.destaque }));
  (c.linhas || []).slice(0, 12).forEach((l) => d.append(Object.assign(document.createElement("div"),
    { className: "l", textContent: typeof l === "string" ? l : (l.texto || l.nome || JSON.stringify(l)) })));
  if (c.imagem) d.append(Object.assign(document.createElement("img"), { src: c.imagem, alt: "" }));
  (c.links || []).slice(0, 6).forEach((l) => d.append(botaoDeLink(l.url, l.texto || l.titulo)));
  $("conversa").append(d);
  d.scrollIntoView({ block: "end", behavior: "smooth" });
}

// ---------------------------------------------------------------- links: abrem NO CELULAR, com um toque
// (o que ele pede aqui pra abrir — site, Maps, YouTube, ligação — vem como botão; o iPhone não deixa abrir sozinho)
function nomeDoLink(url) {
  if (/^tel:/.test(url)) return "Ligar";
  if (/maps\.google|google\.[a-z.]+\/maps/.test(url)) return "Abrir no Maps";
  if (/wa\.me|whatsapp/.test(url)) return "Abrir no WhatsApp";
  try { return "Abrir " + new URL(url).hostname.replace(/^www\./, ""); } catch { return "Abrir"; }
}
function botaoDeLink(url, texto) {
  const a = Object.assign(document.createElement("a"), { href: url, target: "_blank", rel: "noopener", className: "link",
                                                         textContent: texto || nomeDoLink(url) });
  return a;
}
const avisos = new EventSource("/api/extensao/eventos?canal=celular");
avisos.onmessage = (m) => {
  const e = JSON.parse(m.data);
  if (e.limpar_palco) { $("conversa").replaceChildren(); document.documentElement.classList.remove("palco-ativo"); }
  if (!e.link) return;
  const d = document.createElement("div");
  d.className = "cartao";
  d.append(botaoDeLink(e.link.url, e.link.texto));
  $("conversa").append(d);
  d.scrollIntoView({ block: "end", behavior: "smooth" });
};

// ---------------------------------------------------------------- onde o celular está (vale como "aqui" das buscas)
const ios = (navigator.userAgent.match(/OS (\d+)_(\d+)/) || []).slice(1).join(".");
let ultimaPos = 0;
function mandarPosicao(p) {
  if (Date.now() - ultimaPos < 60000) return;  // no máximo uma por minuto
  ultimaPos = Date.now();
  fetch("/api/celular/estado", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lat: p.coords.latitude, lng: p.coords.longitude, precisao: p.coords.accuracy, ios }) }).catch(() => {});
}
if (navigator.geolocation) navigator.geolocation.watchPosition(mandarPosicao, () => {}, { enableHighAccuracy: true, maximumAge: 120000 });
else if (ios) fetch("/api/celular/estado", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ios }) });

// ---------------------------------------------------------------- voz pelo Web Audio, destravado no 1º toque
// (o iPhone só deixa tocar som que começou num toque; um AudioContext retomado no toque toca o resto sozinho)
let ctx = null;
// "playback" = toca mesmo com o iPhone no silencioso, MAS trava o microfone ("AudioSession category is not compatible
// with audio capture"): na hora de gravar vira "play-and-record" e, fechado o microfone, volta pra "playback"
function sessaoDeAudio(tipo) { try { if (navigator.audioSession) navigator.audioSession.type = tipo; } catch {} }
sessaoDeAudio("playback");
function destravar() {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state !== "running") ctx.resume();
  const b = ctx.createBufferSource();  // um "nada" tocado dentro do toque: termina de destravar no iOS
  b.buffer = ctx.createBuffer(1, 1, 22050);
  b.connect(ctx.destination);
  b.start(0);
}
let an = null;
function analisador() {
  if (!an) { an = ctx.createAnalyser(); an.fftSize = 256; an.smoothingTimeConstant = 0.75; an.connect(ctx.destination); }
  return an;
}
// onda em volta do núcleo (igual a do PC): segue a voz dele, ou a sua enquanto grava
const volumes = new Uint8Array(128);
let micAn = null;
function animarOnda() {
  const tela = $("onda");
  const lado = Math.round(tela.clientWidth * devicePixelRatio);
  if (lado && tela.width !== lado) tela.width = tela.height = lado;
  const g = tela.getContext("2d");
  g.clearRect(0, 0, lado, lado);
  const fonte = document.body.classList.contains("gravando") ? micAn : (tocando ? an : null);
  if (fonte) fonte.getByteFrequencyData(volumes); else volumes.fill(0);
  const barras = 72, meio = lado / 2, raio = lado / 3.6, tempo = Date.now() / 600;
  const cor = getComputedStyle(document.body).getPropertyValue("--ciano").trim() || "#39d0ff";
  let soma = 0;
  g.strokeStyle = cor; g.shadowColor = cor; g.shadowBlur = 8; g.lineWidth = Math.max(2, lado / 240);
  for (let i = 0; i < barras; i++) {
    const v = volumes[Math.floor((i < barras / 2 ? i : barras - i) * 1.4)] / 255;
    soma += v;
    const tam = raio * (0.02 + 0.015 * Math.sin(tempo + i / 4) + v * 0.55);
    const ang = (i / barras) * Math.PI * 2 - Math.PI / 2;
    g.globalAlpha = 0.35 + v * 0.65;
    g.beginPath();
    g.moveTo(meio + Math.cos(ang) * raio, meio + Math.sin(ang) * raio);
    g.lineTo(meio + Math.cos(ang) * (raio + tam), meio + Math.sin(ang) * (raio + tam));
    g.stroke();
  }
  document.documentElement.style.setProperty("--nivel", Math.min(1, (soma / barras) * 2.2).toFixed(3));
  requestAnimationFrame(animarOnda);
}
requestAnimationFrame(animarOnda);
const fila = [];
let tocandoFila = false, tocando = null;
function falar(frase) {
  frase = (frase || "").replace(/[*#_`]/g, "").trim();
  if (!frase) return;
  // já pede o áudio enquanto a frase anterior toca
  fila.push(fetch("/api/voz?texto=" + encodeURIComponent(frase)).then((r) => r.arrayBuffer())
    .then((buf) => new Promise((ok, erro) => ctx.decodeAudioData(buf, ok, erro))).catch(() => null));
  if (!tocandoFila) tocarFila();
}
async function tocarFila() {
  tocandoFila = true;
  while (fila.length) {
    const audio = await fila.shift();
    if (!audio || !tocandoFila) continue;
    estado("falando", "Falando");
    await new Promise((ok) => {
      tocando = ctx.createBufferSource();
      tocando.buffer = audio;
      tocando.connect(analisador());
      tocando.onended = ok;
      tocando.start(0);
    });
    tocando = null;
  }
  tocandoFila = false;
  if (!ocupado) estado("", "Toque no núcleo pra falar");
}
function calar() {
  fila.length = 0;
  tocandoFila = false;
  try { tocando?.stop(); } catch {}
}

// ---------------------------------------------------------------- conversa (mesmo /api/conversar da tela do PC)
async function chamar(url, corpo) {
  ocupado = true;
  estado("pensando", "Pensando");
  let texto = "", falado = 0, bolha = null;
  const mostrar = () => {
    if (!bolha) bolha = escrever("", "ele");
    bolha.textContent = texto.trim();
    bolha.scrollIntoView({ block: "end" });
  };
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
    const leitor = r.body.getReader(), dec = new TextDecoder();
    let resto = "";
    for (;;) {
      const { value, done } = await leitor.read();
      if (done) break;
      resto += dec.decode(value, { stream: true });
      const linhas = resto.split("\n");
      resto = linhas.pop();
      for (const linha of linhas.filter(Boolean)) {
        const e = JSON.parse(linha);
        if (e.sessao) sessao = e.sessao;
        if (e.cartao && (!e.cartao.onde || e.cartao.onde === "aqui")) cartao(e.cartao);  // os grandes vão pro palco
        if (e.entendido) { const m = [...document.querySelectorAll(".fala.eu")].pop(); if (m) m.textContent = e.entendido; }
        if (e.erro) escrever("Falha: " + e.erro, "erro");
        if (e.leitura) {
          falar(texto.slice(falado)); falado = texto.length;
          e.leitura.frases.forEach((f, i) => { texto += (texto ? " " : "") + f; falado = texto.length; falar(f);
                                              if (e.leitura.cartoes?.[i]) cartao(e.leitura.cartoes[i]); });
          mostrar();
        }
        if (e.trecho) {
          texto += e.trecho;
          mostrar();
          // a primeira frase já sai falando; o resto vai junto no fim
          if (!falado || e.falar_ja) {
            const corte = e.falar_ja ? [texto.slice(falado)] : texto.slice(falado).match(/^[\s\S]{20,}?[.!?;:\n]\s/);
            if (corte) { falar(corte[0]); falado += corte[0].length; }
          }
        }
        if (e.pendente) {
          $("confirmar").hidden = false;
          falar(e.pendente.fala || "Confirma, chefe?");
        }
      }
    }
    falar(texto.slice(falado));
  } catch (e) {
    escrever("Não falei com o PC: " + e.message + ". O PC está ligado com o Jarvis aberto?", "erro");
  }
  ocupado = false;
  if (!tocandoFila) estado("", "Toque no núcleo pra falar");
}
function perguntar(texto) {
  texto = (texto || "").trim();
  if (!texto) return;
  escrever(texto, "eu");
  chamar("/api/conversar", { sessao, texto, alternativas: [], celular: true });
}
document.querySelectorAll("#confirmar button").forEach((b) => b.onclick = () => {
  destravar();
  $("confirmar").hidden = true;
  escrever(b.dataset.sim ? "Sim" : "Não", "eu");
  chamar("/api/decidir", { sessao, autorizado: !!b.dataset.sim });
});
$("texto").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  destravar();
  perguntar(e.target.value);
  e.target.value = "";
  e.target.blur();
});

// ---------------------------------------------------------------- microfone: toca pra gravar, para no silêncio
let gravador = null, fluxo = null, pedacos = [], vigia = null;
// ---------------------------------------------------------------- permissão do microfone
// O aviso só aparece se o microfone AINDA não está liberado; liberado, nunca aparece. Se o iPhone negar, ele mostra
// o caminho certo pra liberar (Safari, app da tela de início ou navegador de dentro do WhatsApp/Instagram).
const DENTRO_DE_APP = /FBAN|FBAV|Instagram|WhatsApp|Line\//i.test(navigator.userAgent);
const NA_TELA_DE_INICIO = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const lembrar = (v) => { try { v ? localStorage.setItem("mic-ok", "1") : localStorage.removeItem("mic-ok"); } catch {} };
const lembrado = () => { try { return localStorage.getItem("mic-ok") === "1"; } catch { return false; } };

async function estadoDoMic() {
  try { return (await navigator.permissions.query({ name: "microphone" })).state; } catch { return null; }
}
function ajudaDoMic(erro) {
  if (!navigator.mediaDevices?.getUserMedia || DENTRO_DE_APP)
    return "Você abriu o Jarvis por dentro de outro app (WhatsApp, Instagram…), e lá o microfone não funciona.\n" +
           "Toque nos ••• / no ícone da bússola e escolha “Abrir no Safari”. Ou copie o link e cole no Safari.";
  if (erro === "NotFoundError") return "O iPhone não achou nenhum microfone. Tira o fone Bluetooth/USB e tente de novo.";
  if (erro === "NotReadableError") return "Outro app está usando o microfone (ligação, gravador, Siri). Fecha ele e tente de novo.";
  if (NA_TELA_DE_INICIO)
    return "O iPhone recusou o microfone pro app da tela de início.\n1. Ajustes → Safari → Microfone → Permitir\n" +
           "2. Feche o Jarvis (arraste pra cima) e abra de novo.\nSe não voltar: apague o ícone e adicione de novo pelo Safari.";
  return "O Safari recusou o microfone.\n1. Toque no “aA” (ou no cadeado) na barra de endereço → Ajustes do Site → Microfone → Permitir\n" +
         "2. Ou: Ajustes do iPhone → Safari → Microfone → Permitir\nDepois toque em “Ativar microfone” de novo.";
}
function mostrarPermissao(erro) {
  const ajuda = $("perm-ajuda");
  ajuda.hidden = !erro;
  if (erro) ajuda.textContent = ajudaDoMic(erro) + "\n\n(código: " + erro + ")";
  $("ativar-mic").textContent = erro ? "Tentar de novo" : "Ativar microfone";
  $("permissao").hidden = false;
}
function registrar(o) {
  estadoDoMic().then((st) => fetch("/api/celular/log", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...o, permissao: st, tela_inicio: NA_TELA_DE_INICIO, seguro: isSecureContext, temMic: !!navigator.mediaDevices?.getUserMedia,
                           ua: navigator.userAgent }) }).catch(() => {}));
}
async function pedirMic() {
  if (!navigator.mediaDevices?.getUserMedia) throw Object.assign(new Error("sem microfone"), { name: "SemSuporte" });
  sessaoDeAudio("play-and-record");
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    sessaoDeAudio("playback");
    throw e;
  }
}
function fecharMic(f) {
  f?.getTracks().forEach((x) => x.stop());
  sessaoDeAudio("playback");
}
$("ativar-mic").onclick = async () => {
  destravar();
  try {
    const f = await pedirMic();
    fecharMic(f);  // só pra liberar; abre de novo na hora de falar
    lembrar(true);
    $("permissao").hidden = true;
    escrever("Microfone ativado. Toque no núcleo e fale.", "ele");
  } catch (e) {
    lembrar(false);
    registrar({ onde: "botao", erro: e.name, msg: e.message });
    mostrarPermissao(e.name || "NotAllowedError");
  }
};
$("perm-depois").onclick = () => { $("permissao").hidden = true; };
(async () => {
  const st = await estadoDoMic();
  if (st === "granted") return lembrar(true);  // já liberado: o aviso não aparece
  registrar({ onde: "abriu", erro: null });
  if (st === "denied") return mostrarPermissao("NotAllowedError");
  if (st === null && lembrado()) return;  // sem como perguntar (Safari antigo) e já funcionou antes
  if (DENTRO_DE_APP || !navigator.mediaDevices?.getUserMedia) return mostrarPermissao("SemSuporte");
  mostrarPermissao();
})();
navigator.permissions?.query({ name: "microphone" }).then((p) => {
  p.onchange = () => { if (p.state === "granted") { lembrar(true); $("permissao").hidden = true; } };
}).catch(() => {});

async function comecar() {
  try {
    fluxo = await pedirMic();
    lembrar(true);
  } catch (e) {
    lembrar(false);
    registrar({ onde: "nucleo", erro: e.name, msg: e.message });
    return mostrarPermissao(e.name || "NotAllowedError");
  }
  const tipo = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find((t) => window.MediaRecorder?.isTypeSupported?.(t)) || "";
  gravador = new MediaRecorder(fluxo, tipo ? { mimeType: tipo } : {});
  pedacos = [];
  gravador.ondataavailable = (e) => e.data.size && pedacos.push(e.data);
  gravador.onstop = enviarGravacao;
  gravador.start(250);
  estado("gravando", "Ouvindo…");
  // para sozinho depois de ~1,3 s de silêncio (e no máximo 25 s)
  const fonte = ctx.createMediaStreamSource(fluxo);
  micAn = ctx.createAnalyser();
  micAn.fftSize = 256;
  fonte.connect(micAn);
  const buf = new Uint8Array(micAn.fftSize);
  const inicio = Date.now();
  let falou = false, quieto = Date.now();
  vigia = setInterval(() => {
    micAn.getByteTimeDomainData(buf);
    let pico = 0;
    for (const v of buf) pico = Math.max(pico, Math.abs(v - 128));
    if (pico > 14) { falou = true; quieto = Date.now(); }
    const agora = Date.now();
    if ((falou && agora - quieto > 1300) || agora - inicio > 25000 || (!falou && agora - inicio > 7000)) parar();
  }, 80);
}
function parar() {
  clearInterval(vigia);
  if (gravador?.state === "recording") gravador.stop();
  // fecha o microfone: com ele aberto o iPhone joga a voz do Jarvis no alto-falante de ligação, baixinho
  setTimeout(() => { fecharMic(fluxo); fluxo = null; }, 300);
}
async function enviarGravacao() {
  const blob = new Blob(pedacos, { type: gravador.mimeType || "audio/mp4" });
  estado("pensando", "Entendendo");
  try {
    const r = await fetch("/api/celular/ouvir", { method: "POST", headers: { "Content-Type": blob.type.split(";")[0] }, body: blob });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.status);
    if (!j.texto) { estado("", "Não ouvi nada. Toque e fale"); return; }
    perguntar(j.texto);
  } catch (e) {
    escrever("Não entendi o áudio: " + e.message, "erro");
    estado("", "Toque no núcleo pra falar");
  }
}
$("nucleo").onclick = $("mic").onclick = () => {
  destravar();
  if (gravador?.state === "recording") return parar();
  if (tocandoFila) calar();  // tocou enquanto ele fala: cala e ouve
  if (ocupado) return;
  comecar();
};
escrever("Pronto, chefe. Toque no núcleo e fale comigo.", "ele");
</script>
